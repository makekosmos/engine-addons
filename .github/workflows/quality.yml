name: Runtime supply-chain quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          version: "3.97.1"
          extra_args: --results=verified,unknown
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.4.1
      - name: Install dependencies and hooks
        run: pnpm install --config.lockfile=false
      - name: Reject runtime binaries in active source
        shell: bash
        run: |
          if git ls-files '*.zip' '*.exe' '*.dll' '*.bin' | grep -q .; then
            echo 'Runtime binaries must be immutable release assets, not source files.' >&2
            exit 1
          fi
      - name: Run aggregate verification
        run: pnpm run check
      - name: Verify no-lock package-manager policy
        run: pnpm run test:package-manager
      - name: Prove deterministic secret-free dry-run
        shell: bash
        run: |
          first="$(node scripts/dry-run.mjs)"
          second="$(node scripts/dry-run.mjs)"
          test "$first" = "$second"
          printf '%s\n' "$first"
      - name: Actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
